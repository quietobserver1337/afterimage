<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>afterimage</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>afterimage</h1>
<p>{{ total }} images indexed</p>
<div class="grid">
{% for r in rows %}
<figure>
  <img src="/thumb/{{ r[0] }}">
  <figcaption>{{ r[1] }}<br>{{ r[2] }}&times;{{ r[3] }}</figcaption>
</figure>
{% endfor %}
</div>
</body>
</html>
